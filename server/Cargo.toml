[package]
name = "winestock-server"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
# 服务端 Debug 需要 Swagger UI 时显式启用；Release 不启用，避免编译 Swagger UI。
swagger-ui = ["winestock-core/swagger-ui"]

[dependencies]
# server 是无前端的正式服务端平台壳，只负责进程生命周期、配置读取和状态输出。
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
winestock-core = { workspace = true }
winestock-shared = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
