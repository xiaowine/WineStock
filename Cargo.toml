[workspace]
resolver = "2"
# 根目录只作为 Cargo 工作区，不承载应用或库代码。
members = [
  "android/native",
  "core",
  "server",
  "shared",
]

[workspace.package]
# 所有 Rust 包共享同一个版本号和语言版本。
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# 统一在工作区根声明依赖版本，成员包通过 workspace = true 复用。
axum = { version = "0.8", features = ["multipart"] }
argon2 = "0.5.3"
base64 = "0.22"
getrandom = "0.4.3"
garde = { version = "0.23.0", features = ["derive"] }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
jni = "0.22.4"
log = "0.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
# 出站 TLS 使用内置 webpki 根证书：reqwest 默认的 rustls-platform-verifier 在 Android 上需要
# JNI 初始化，未初始化时首次握手直接 panic；上游只有固定公网域名，内置根即可且三端行为一致。
rustls = "0.23"
webpki-roots = "1"
sea-orm = { version = "1.1.20", default-features = false, features = ["macros", "runtime-tokio", "sqlx-sqlite"] }
sea-orm-migration = { version = "1.1.20", default-features = false, features = ["runtime-tokio", "sqlx-sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sqlx = { version = "0.8.4", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5.3"
utoipa = "5"
utoipa-axum = "0.2"
# vendored 为 Debug Swagger UI 提供本地资源；Release 不引用或链接这些资源。
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
url = "2.5.8"
winestock-core = { path = "core" }
winestock-shared = { path = "shared" }
