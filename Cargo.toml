[workspace]
resolver = "2"
# 根目录只作为 Cargo 工作区，不承载应用或库代码。
members = [
  "android/native",
  "core",
  "desktop",
  "server",
  "shared",
]

[workspace.package]
# 所有 Rust 包共享同一个版本号和语言版本。
version = "0.1.0"
edition = "2021"

[profile.release]
lto = "thin"
strip = false

[workspace.dependencies]
# 统一在工作区根声明依赖版本，成员包通过 workspace = true 复用。
axum = { version = "0.8", features = ["multipart"] }
argon2 = "0.5.3"
base64 = "0.23.0"
getrandom = "0.4.3"
garde = { version = "0.23.0", features = ["derive"] }
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
jni = "0.22.4"
log = "0.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
# 出站 TLS 使用内置 webpki 根证书：reqwest 默认的 rustls-platform-verifier 在 Android 上需要
# JNI 初始化，未初始化时首次握手直接 panic；上游只有固定公网域名，内置根即可且三端行为一致。
# 与 KeyWine 当前 Windows 产物保持同一 Rustls/AWS-LC 版本链，避免升级到会引入
# VCRUNTIME140.dll 的 AWS-LC 构建变体；版本升级需重新做 Windows 导入表检查。
rustls = { version = "=0.23.40", default-features = false, features = ["std"] }
webpki-roots = "1"
sea-orm = { version = "2.0.0", default-features = false, features = ["macros", "runtime-tokio", "sqlite-use-returning-for-3_35", "sqlx-sqlite"] }
sea-orm-migration = { version = "2.0.0", default-features = false, features = ["runtime-tokio", "sqlx-sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-build = "2.6.3"
tauri-plugin-autostart = "2"
tauri-plugin-prevent-default = "5"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower = "0.5.3"
utoipa = "5"
utoipa-axum = "0.2"
# vendored 为 Debug Swagger UI 提供本地资源；Release 不引用或链接这些资源。
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
url = "2.5.8"
rfd = "0.17.2"
if-addrs = "0.15.0"
webview2-com = "0.38.2"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_WindowsFirewall",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }
winestock-core = { path = "core" }
winestock-shared = { path = "shared" }
