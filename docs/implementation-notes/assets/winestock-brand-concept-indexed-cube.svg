    <text x="64" y="98" fill="#6B7078" font-size="16">Cross-platform identity concept / Indexed Cube / option C</text>
    <line x1="64" y1="126" x2="1136" y2="126" stroke="#D8DBE0" />

    <g transform="translate(64 168)">
      <rect width="610" height="282" rx="8" fill="#FFFFFF" stroke="#D8DBE0" />
