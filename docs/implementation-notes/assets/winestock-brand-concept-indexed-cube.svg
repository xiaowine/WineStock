      <text x="392" y="80" fill="#24272C" font-size="17" font-weight="650">A cataloged stock unit, not a letter</text>
      <text x="392" y="108" fill="#6B7078" font-size="14">Separated facets preserve the cube in one-color system themes.</text>
      <text x="392" y="132" fill="#6B7078" font-size="14">The inset face label suggests indexing without barcode detail.</text>
    </g>

    <g transform="translate(64 694)">
