<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="board-title board-desc">
  <title id="board-title">WineStock Indexed Cube cross-platform brand concept</title>
  <desc id="board-desc">Review board showing a non-letter indexed inventory cube across launcher, themed icon, favicon, and frontend contexts.</desc>
  <defs>
    <symbol id="indexed-cube" viewBox="0 0 108 108">
      <path
        fill="currentColor"
        fill-rule="evenodd"
        d="M54 18 88 35 54 52 20 35l34-17ZM20 43l30 15v32L20 75V43Zm38 15 30-15v32L58 90V58Zm7 5 16-8v7l-16 8v-7Z"
      />
    </symbol>
    <clipPath id="circle-mask-c">
      <circle cx="925" cy="292" r="64" />
    </clipPath>
    <clipPath id="squircle-mask-c">
      <rect x="1008" y="228" width="128" height="128" rx="30" />
    </clipPath>
  </defs>

  <rect width="1200" height="820" fill="#F4F5F7" />

  <g font-family="Inter, Segoe UI, Arial, sans-serif" letter-spacing="0">
