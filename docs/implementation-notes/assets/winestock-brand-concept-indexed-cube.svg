    <g transform="translate(548 694)">
      <rect width="588" height="94" rx="8" fill="#FFFFFF" stroke="#D8DBE0" />
      <use href="#indexed-cube" x="22" y="16" width="62" height="62" color="#6F2A36" />
      <text x="108" y="38" fill="#24272C" font-size="16" font-weight="650">Indexed Cube</text>
      <text x="108" y="63" fill="#6B7078" font-size="13">One stock object, structured identity, platform-neutral geometry.</text>
    </g>
