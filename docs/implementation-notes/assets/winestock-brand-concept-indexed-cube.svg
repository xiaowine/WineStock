      <rect x="28" y="66" width="188" height="188" rx="8" fill="#6F2A36" />
      <use href="#indexed-cube" x="58" y="96" width="128" height="128" color="#F4F5F7" />

      <g transform="translate(258 100)">
        <use href="#indexed-cube" width="68" height="68" color="#6F2A36" />
        <text x="86" y="47" fill="#24272C" font-size="42" font-weight="700">WineStock</text>
        <rect x="88" y="65" width="49" height="24" rx="4" fill="#EAD4D8" />
        <text x="112.5" y="82" fill="#6F2A36" font-size="11" font-weight="700" text-anchor="middle">BETA</text>
      </g>

      <g transform="translate(258 205)">
        <rect width="260" height="42" rx="4" fill="#F4F5F7" stroke="#D8DBE0" />
