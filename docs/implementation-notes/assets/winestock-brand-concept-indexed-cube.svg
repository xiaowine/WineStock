      </g>
      <g transform="translate(198 26)">
        <rect width="24" height="24" rx="3" fill="#6F2A36" />
        <use href="#indexed-cube" x="3" y="3" width="18" height="18" color="#F4F5F7" />
        <text x="12" y="50" fill="#6B7078" font-size="11" text-anchor="middle">24</text>
      </g>
      <g transform="translate(260 30)">
        <rect width="16" height="16" rx="2" fill="#6F2A36" />
        <use href="#indexed-cube" x="2" y="2" width="12" height="12" color="#F4F5F7" />
