        <text x="238" y="27" fill="#6B7078" font-size="11" text-anchor="end">compact</text>
      </g>
    </g>

    <g>
      <text x="714" y="192" fill="#6B7078" font-size="13" font-weight="600">SHELL MASKS</text>

