name: Build Desktop and Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Build Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build Windows NSIS installer
        run: pnpm --dir frontend run desktop:build

      - name: Generate desktop update manifest
        shell: pwsh
        env:
          UPDATE_BASE_URL: https://api.ikuns.top/WineRealm/file/winestock/file
        run: |
          $installer = Get-ChildItem -File target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'Windows installer not found'
          }
          $version = (Get-Content -Raw desktop/tauri.conf.json | ConvertFrom-Json).version
          $sha256 = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = $version
            url = "$env:UPDATE_BASE_URL/$($installer.Name)"
            sha256 = $sha256
            notes = ''
          }
          $manifest | ConvertTo-Json -Compress | Set-Content -Encoding utf8 desktop.json

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: winestock-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop update manifest
        uses: actions/upload-artifact@v7
        with:
          name: winestock-desktop-update
          path: desktop.json
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache cargo-ndk
        id: cargo-ndk-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-4.1.2

      - name: Install cargo-ndk
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Fetch Rust dependencies
        run: cargo fetch --locked

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Prepare Android release signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing Android signing secret::$name is required for a release APK"
              exit 1
            fi
          done
          mkdir -p android/.secrets
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/.secrets/release.keystore
          chmod 600 android/.secrets/release.keystore

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Build signed debug APK for pull request
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify release APK signature
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apk" || { echo "::error::Release APK not found"; exit 1; }
          test -n "$apksigner" || { echo "::error::apksigner not found"; exit 1; }
          "$apksigner" verify --verbose "$apk"

      - name: Verify debug APK signature
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apk" || { echo "::error::Debug APK not found"; exit 1; }
          test -n "$apksigner" || { echo "::error::apksigner not found"; exit 1; }
          "$apksigner" verify --verbose "$apk"

      - name: Generate Android update manifest
        shell: bash
        env:
          UPDATE_BASE_URL: https://api.ikuns.top/WineRealm/file/winestock/file
        run: |
          set -euo pipefail
          if [ -d android/app/build/outputs/apk/release ]; then
            output_dir=android/app/build/outputs/apk/release
          else
            output_dir=android/app/build/outputs/apk/debug
          fi
          apk="$(find "$output_dir" -type f -name '*.apk' -print -quit)"
          metadata="$output_dir/output-metadata.json"
          test -n "$apk" || { echo "::error::Android APK not found"; exit 1; }
          test -f "$metadata" || { echo "::error::Android APK metadata not found"; exit 1; }
          filename="$(basename "$apk")"
          version="$(jq -r '.elements[0].versionName' "$metadata")"
          sha256="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          test -n "$version" && test "$version" != "null"
          jq -n \
            --arg version "$version" \
            --arg url "$UPDATE_BASE_URL/$filename" \
            --arg sha256 "$sha256" \
            '{version: $version, url: $url, sha256: $sha256, notes: ""}' \
            > android.json

      - name: Upload Android update manifest
        uses: actions/upload-artifact@v7
        with:
          name: winestock-android-update
          path: android.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: winestock-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: winestock-android-pr-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
