name: Build Desktop and Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Build Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build Windows NSIS installer
        run: pnpm --dir frontend run desktop:build

      - name: Build Windows Server package
        shell: pwsh
        run: |
          cargo build --release -p winestock-server --locked
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'winestock-server').version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'WineStock Server version not found in Cargo metadata'
          }
          New-Item -ItemType Directory -Force -Path target/release/distribution | Out-Null
          $archive = "target/release/distribution/WineStock-server-$version-windows-x64.zip"
          Compress-Archive -Path target/release/winestock-server.exe -DestinationPath $archive -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: winestock-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows Server package
        uses: actions/upload-artifact@v7
        with:
          name: winestock-server-windows
          path: target/release/distribution/WineStock-server-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;30.0.14904198'

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache cargo-ndk
        id: cargo-ndk-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-4.1.2

      - name: Install cargo-ndk
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Fetch Rust dependencies
        run: cargo fetch --locked

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Prepare Android release signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing Android signing secret::$name is required for a release APK"
              exit 1
            fi
          done
          mkdir -p android/.secrets
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/.secrets/release.keystore
          chmod 600 android/.secrets/release.keystore

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          WINSTOCK_ANDROID_KEYSTORE_FILE: .secrets/release.keystore
          WINSTOCK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WINSTOCK_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WINSTOCK_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Build signed debug APK for pull request
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify release APK signature
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apk" || { echo "::error::Release APK not found"; exit 1; }
          test -n "$apksigner" || { echo "::error::apksigner not found"; exit 1; }
          "$apksigner" verify --verbose "$apk"

      - name: Verify debug APK signature
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apk" || { echo "::error::Debug APK not found"; exit 1; }
          test -n "$apksigner" || { echo "::error::apksigner not found"; exit 1; }
          "$apksigner" verify --verbose "$apk"

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: winestock-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: winestock-android-pr-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release-manifest:
    name: Generate Unified Update Manifest
    needs: [desktop, android]
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          pattern: winestock-*
          merge-multiple: true

      - name: Generate unified update manifest
        shell: bash
        env:
          UPDATE_BASE_URL: https://tapan.top/file/winestock
        run: |
          set -euo pipefail
          installer="$(find release-artifacts -type f -name '*.exe' -print -quit)"
          apk="$(find release-artifacts -type f -name '*.apk' -print -quit)"
          server_archive="$(find release-artifacts -type f -name 'WineStock-server-*-windows-x64.zip' -print -quit)"
          test -n "$installer" || { echo '::error::Windows installer not found'; exit 1; }
          test -n "$apk" || { echo '::error::Android APK not found'; exit 1; }
          test -n "$server_archive" || { echo '::error::Windows Server package not found'; exit 1; }

          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "winestock-server") | .version')"
          test -n "$version" && test "$version" != 'null'
          jq -n \
            --arg version "$version" \
            --arg base_url "$UPDATE_BASE_URL" \
            --arg desktop_file "$(basename "$installer")" \
            --arg desktop_sha256 "$(sha256sum "$installer" | cut -d ' ' -f 1)" \
            --arg android_file "$(basename "$apk")" \
            --arg android_sha256 "$(sha256sum "$apk" | cut -d ' ' -f 1)" \
            --arg server_file "$(basename "$server_archive")" \
            --arg server_sha256 "$(sha256sum "$server_archive" | cut -d ' ' -f 1)" \
            '{version: $version, baseUrl: $base_url, notes: "", desktop: {file: $desktop_file, sha256: $desktop_sha256}, android: {file: $android_file, sha256: $android_sha256}, server: {file: $server_file, sha256: $server_sha256}}' \
            > winestock.json

      - name: Upload unified update manifest
        uses: actions/upload-artifact@v7
        with:
          name: winestock-update-manifest
          path: winestock.json
          if-no-files-found: error
          retention-days: 14
