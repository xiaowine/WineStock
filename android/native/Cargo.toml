[package]
name = "winestock-android"
version.workspace = true
edition.workspace = true
publish = false

[lib]
# Android 只打包 cdylib；rlib 用于宿主机 contract/config 单元测试。
name = "winestock_android"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Android Debug 构建使用开发期 API 文档 UI；Release 不启用，避免编译和链接 Swagger UI。
debug-swagger-ui = ["winestock-core/swagger-ui"]

[dependencies]
jni = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
winestock-core = { workspace = true }
winestock-shared = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"

[dev-dependencies]
tempfile = { workspace = true }
